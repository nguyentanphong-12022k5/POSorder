name: CI/CD Pipeline - POS Order

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==============================================================================
  # 1. KIỂM TRA LỖI CÚ PHÁP & TYPESCRIPT (LINT & TYPECHECK)
  # ==============================================================================
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cài đặt Dependencies
        run: npm ci --legacy-peer-deps

      - name: Khởi tạo Prisma Client
        run: npx prisma generate

      - name: Kiểm tra TypeScript Compile
        run: npx tsc --noEmit

  # ==============================================================================
  # 2. KIỂM THỬ HỆ THỐNG (UNIT & INTEGRATION TESTS)
  # ==============================================================================
  test:
    name: Unit & Integration Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "test-secret-key-12345678901234567890"
      AUTH_SECRET: "test-secret-key-12345678901234567890"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cài đặt Dependencies
        run: npm ci --legacy-peer-deps

      - name: Khởi tạo Database Kiểm thử (SQLite)
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts

      - name: Chạy bộ kiểm thử tự động (Vitest)
        run: npx vitest run --reporter=verbose --no-file-parallelism

  # ==============================================================================
  # 3. BUILD ĐÓNG GÓI SẢN PHẨM (BUILD STANDALONE)
  # ==============================================================================
  build:
    name: Next.js Standalone Build
    needs: test
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "test-secret-key-12345678901234567890"
      AUTH_SECRET: "test-secret-key-12345678901234567890"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cài đặt Dependencies
        run: npm ci --legacy-peer-deps

      - name: Khởi tạo Database cho Build
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts

      - name: Build ứng dụng Next.js
        run: npm run build

  # ==============================================================================
  # 4. DEPLOY PRODUCTION (CHẠY KHI MERGE VÀO MAIN)
  # ==============================================================================
  deploy:
    name: Deploy to Production (VPS / Docker Compose)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      # --- CÁCH 1: DEPLOY LÊN VPS QUA SSH DOCKER COMPOSE ---
      - name: Deploy lên VPS qua SSH
        if: ${{ env.SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Bắt đầu cập nhật mã nguồn trên VPS..."
            cd /opt/pos-order
            git fetch origin main
            git reset --hard origin/main
            docker compose down
            docker compose up -d --build
            echo "✅ Cập nhật hoàn tất! Kiểm tra sức khỏe hệ thống:"
            docker compose exec -T app wget -qO- http://localhost:3000/api/health || true

      # --- CÁCH 2: DEPLOY LÊN VERCEL (NẾU DÙNG VERCEL HOSTING) ---
      # Để kích hoạt Vercel deploy, chỉ cần thêm các Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
      - name: Deploy lên Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
