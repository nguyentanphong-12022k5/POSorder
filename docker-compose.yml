version: '3.8'

services:
  # 1. Ứng dụng Next.js Standalone POS Order & KDS
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_order_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-posorder}?schema=public
      - NODE_ENV=production
      - RUN_MIGRATIONS=true
      - JWT_SECRET=${JWT_SECRET:-pos-production-secret-change-me-random-string}
      - PRINTER_MODE=${PRINTER_MODE:-tcp}
      - PRINTER_IP=${PRINTER_IP:-printer-bridge}
      - PRINTER_PORT=${PRINTER_PORT:-9100}
      - PRINTER_MODEL=${PRINTER_MODEL:-Xprinter XP-58 / Epson TM-T82}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION:-1.0.0}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - pos_internal_network
      - pos_lan_network

  # 2. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: pos_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-posorder}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432" # Có thể truy cập nội bộ để backup hoặc quản lý bằng DBeaver/pgAdmin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-posorder}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos_internal_network

  # 3. Printer Bridge (Cầu nối máy in ESC/POS qua mạng LAN)
  # Chuyển tiếp cổng 9100 từ mạng Docker nội bộ tới IP máy in thực tế trong quán (LAN)
  printer-bridge:
    image: alpine/socat:latest
    container_name: pos_printer_bridge
    restart: unless-stopped
    command: -d -d TCP-LISTEN:9100,fork,reuseaddr TCP:${PRINTER_REAL_LAN_IP:-192.168.1.100}:9100
    networks:
      - pos_internal_network
      - pos_lan_network

networks:
  pos_internal_network:
    driver: bridge
  pos_lan_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
